name: sadovnikov-demo

services:
  db:
    image: postgres:17-bookworm
    restart: unless-stopped
    env_file:
      - .env.demo
    volumes:
      - demo_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env.demo
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:3003:3000"
    volumes:
      - /srv/portfolio-demo/uploads:/app/public/uploads

volumes:
  demo_postgres_data: