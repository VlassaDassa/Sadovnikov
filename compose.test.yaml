name: sadovnikov-test

services:
  postgres:
    image: postgres:18-bookworm
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: sadovnikov_test
    ports:
      - "5434:5432"
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U postgres -d sadovnikov_test
      interval: 2s
      timeout: 3s
      retries: 30